asyncapi: 3.0.0
info:
  title: Order Service AsyncAPI Specification
  version: 1.0.0
  description: AsyncAPI specification of Kafka consumers and producers
operations:
  sendOrderEvent_1001:
    action: send
    channel:
      $ref: '#/channels/orderEvents_1001'
    title: orderEvents_1001 send
    description: Publish priority order events to order-events
    messages:
      - $ref: '#/channels/orderEvents_1001/messages/OrderEvent_1001'
      - $ref: '#/channels/orderEvents_1001/messages/OrderShipped_1002'
servers:
  kafka-server:
    host: /
    protocol: kafka
    description: Kafka Broker managed by MaaS
    tags:
      - name: maas
components:
  schemas:
    TenantHeader:
      type: string
      title: Tenant
      description: Tenant identifier
    RequestIdHeader:
      type: string
      title: Request-Id
      description: Request key for duplicate message detection
    OrderEvent:
      title: OrderEvent
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        eventId:
          type: string
          description: Unique event identifier
      description: Kafka payload for order events
    OrderShipped:
      title: OrderShipped
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        trackingId:
          type: string
          description: Carrier tracking identifier
      description: Kafka payload for order shipment events
  messages:
    OrderEvent_1001:
      headers:
        anyOf:
          - $ref: '#/components/schemas/TenantHeader'
          - $ref: '#/components/schemas/RequestIdHeader'
      payload:
        $ref: '#/components/schemas/OrderEvent'
      name: OrderEvent
      title: OrderEvent
      description: Event representing priority order changes
    OrderShipped_1002:
      headers:
        anyOf:
          - $ref: '#/components/schemas/TenantHeader'
          - $ref: '#/components/schemas/RequestIdHeader'
      payload:
        $ref: '#/components/schemas/OrderShipped'
      name: OrderShipped
      title: OrderShipped
      description: Event representing a priority order shipment
channels:
  orderEvents_1001:
    address: order-events
    title: order-events
    description: Kafka topic for priority order events
    servers:
      - $ref: '#/servers/kafka-server'
    messages:
      OrderEvent_1001:
        $ref: '#/components/messages/OrderEvent_1001'
      OrderShipped_1002:
        $ref: '#/components/messages/OrderShipped_1002'
